# LUKS full-disk-encryption support for the sealed image.
#
# The initramfs must use systemd's cryptsetup generator so that LUKS2 tokens
# created by systemd-cryptenroll (TPM2, FIDO2, FIDO2 + PIN, TPM2 + PIN) are
# understood. The FIDO2 and tpm2-tss modules install the userspace libraries
# and udev rules needed to talk to the token/TPM from the initramfs.
#
# The actual root discovery is done by systemd-gpt-auto-generator: the root
# partition uses the Discoverable Partitions root type and is LUKS2-encrypted,
# so systemd unlocks it as /dev/mapper/root before sysroot.mount.
add_dracutmodules+=" dracut-systemd systemd systemd-initrd systemd-cryptsetup crypt fido2 tpm2-tss plymouth "

# The image deliberately does not use clevis; it is removed from the package
# set and systemd-cryptenroll is the supported enrollment path.
omit_dracutmodules+=" clevis clevis-pin-tpm2 "

# Keep the console keymap used for the LUKS passphrase/PIN prompt.
install_items+=" /etc/vconsole.conf "
